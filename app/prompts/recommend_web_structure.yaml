# 코스 추천 임시 경로 2단계 — 1단계의 웹검색 결과를 정해진 형식으로 옮긴다. 검색 도구는 쓰지 않는다.
template: |
  아래는 나들이 코스 추천을 위한 웹검색 결과다. 이것을 정해진 형식으로 옮긴다.

  # 조건
  지역: {region}
  방문 일시: {datetime}
  외출 가능 시간: {available_time}
  카테고리: {category}
  원하는 분위기·조건: {query}

  # 웹검색 결과
  {search_result}

  # 옮기는 규칙
  1. 검색 결과에 없는 장소나 값은 만들지 않는다. 옮기기만 한다.
  2. 코스는 최대 {max_courses}개, 코스마다 장소는 최대 {max_places}곳이며 방문 순서대로 적는다.
  3. travel_minutes 는 직전 지점(첫 장소는 출발지)에서 오는 이동 시간(분), stay_minutes 는
     체류 시간(분)이다. 검색 결과에 없으면 합리적으로 추정한 정수를 적는다.
  4. 영업시간을 모르면 "확인 불가"라고 적는다.
  5. 쓸 만한 장소가 하나도 없으면 courses 를 빈 목록으로 둔다.
