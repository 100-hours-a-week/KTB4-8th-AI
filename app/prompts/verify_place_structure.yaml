# 2단계 — 1단계의 검색 결과를 정해진 형식으로 옮긴다. 검색 도구는 쓰지 않는다.
template: |
  아래는 장소 검증을 위한 웹검색 결과다. 이것을 정해진 형식으로 옮긴다.

  # 찾던 장소
  장소명: {place_name}
  지역: {region}
  특징: {summary}

  # 웹검색 결과
  {search_result}

  # 옮기는 규칙
  1. 검색 결과에 없는 값은 만들지 않는다. 옮기기만 한다.
  2. 찾던 장소로 볼 만한 곳은 두 종류다 — 이름이 같은 곳, 그리고 이름은 조금
     달라도 지역·특징이 맞는 곳. 찾던 장소명은 영상 로고를 읽어 온 것이라 틀렸을
     수 있어서, 뒤의 것도 후보다.
     단, 어느 쪽이든 evidence 에 근거를 적을 수 있어야 후보다 — 찾던 장소의
     특징 중 무엇이 그 가게에 있는지, 검색 결과의 어디서 확인했는지. 근거를 적을
     수 없으면 이름이 같아도 넣지 않는다. 지역·업종만 같은 것은 근거가 아니다.
  3. exists 는 위 기준으로 지금 운영 중인 곳을 하나라도 찾았으면 true, 못 찾았거나
     전부 폐업이면 false. false 면 candidates 는 빈 목록이다.
  4. candidates 는 지역·특징이 가장 잘 맞는 곳부터 순서대로 넣는다. 이름이 정확히
     같은지는 판단 근거 중 하나일 뿐이다. 첫 번째가 자동으로 채택되므로 순서가
     곧 판단이다.
  5. 폐업한 곳, 이름만 같고 업종이 전혀 다른 곳은 candidates 에 넣지 않는다.
  6. 영업시간을 찾지 못한 곳은 business_hours 를 "확인 불가"로 둔다.
  7. 기간 한정 행사로 보이는데 종료일을 찾지 못했으면 event_period_unresolved 를
     true 로, 그 밖에는 false 로 둔다. 날짜는 YYYY-MM-DD 로 적는다.
